<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Donut Table AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>

body{
margin:0;
background:black;
}

model-viewer{
width:100vw;
height:100vh;
}

</style>

</head>

<body>

<model-viewer
src="donut.glb"

ar

ar-modes="webxr scene-viewer quick-look"

camera-controls

touch-action="pan-y"

auto-rotate

shadow-intensity="1"

scale="0.1 0.1 0.1">

</model-viewer>

</body>
</html>

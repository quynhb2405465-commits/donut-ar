<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Donut AR</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>
</head>

<body style="margin:0;">

<model-viewer
  src="donut.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  style="width:100%;height:100vh;">
</model-viewer>

</body>
</html>

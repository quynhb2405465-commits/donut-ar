<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Donut AR</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

<body style="margin:0;">

<model-viewer
  src="donut.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  style="width:100%; height:100vh;">
</model-viewer>

</body>
</html>

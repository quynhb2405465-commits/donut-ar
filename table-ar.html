<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Donut Table AR</title>

<script type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js">
</script>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}

model-viewer{
width:100%;
height:100%;
}

#guide{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
background:rgba(0,0,0,.6);
color:white;
padding:10px 16px;
border-radius:12px;
font-family:Arial;
z-index:999;
}

</style>

</head>

<body>

<div id="guide">
🍩 Bấm AR → quét mặt bàn → chạm để đặt donut
</div>

<model-viewer

src="donut.glb"

ar

ar-modes="webxr scene-viewer quick-look"

camera-controls

touch-action="pan-y"

auto-rotate

shadow-intensity="1"

scale="0.1 0.1 0.1"

exposure="1.2">

</model-viewer>

</body>
</html>
